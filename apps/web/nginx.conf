# Serves the built customer screen and proxies API paths to the compose
# `api` service. The browser stays same-origin in production exactly as it
# does behind the Vite dev proxy: no CORS headers, no API origin baked into
# the bundle, and no secrets anywhere near the frontend.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single-page app fallback (the app is one page today; cheap insurance).
  location / {
    try_files $uri /index.html;
  }

  # Same API path names the Vite dev server proxies (see apps/web/vite.config.ts).
  location ~ ^/(health|products|orders|payments) {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
